[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "smartbms-rcx"
version = "1.0.0"
description = "Explainable synthetic HVAC BMS, optimization, and retro-commissioning portfolio project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "streamlit>=1.42",
]

[tool.setuptools.packages.find]
include = ["smartbms*"]
